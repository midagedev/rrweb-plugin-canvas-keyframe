<!doctype html>
<meta charset="utf-8" />
<title>scene</title>
<body style="margin: 0">
  <canvas id="c" width="1280" height="720" style="width: 640px; height: 360px"></canvas>
  <script type="module">
    // Clears the whole canvas to the current colour every frame, like an app that redraws continuously.
    const colours = { a: [1, 0, 0], b: [0, 1, 0], c: [0, 0, 1], d: [1, 1, 0] };
    let current = colours.a;
    window.setColour = (name) => {
      current = colours[name];
    };
    const canvas = document.getElementById('c');
    const adapter = await navigator.gpu?.requestAdapter();
    if (!adapter) {
      window.sceneReady = 'unsupported';
    } else {
      const device = await adapter.requestDevice();
      const context = canvas.getContext('webgpu');
      context.configure({ device, format: navigator.gpu.getPreferredCanvasFormat(), alphaMode: 'opaque' });
      const loop = () => {
        const encoder = device.createCommandEncoder();
        encoder
          .beginRenderPass({
            colorAttachments: [
              {
                view: context.getCurrentTexture().createView(),
                clearValue: { r: current[0], g: current[1], b: current[2], a: 1 },
                loadOp: 'clear',
                storeOp: 'store',
              },
            ],
          })
          .end();
        device.queue.submit([encoder.finish()]);
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
      window.sceneReady = 'ready';
    }
  </script>
</body>
